<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" role="img" aria-labelledby="title desc">
  <title id="title">LunarSky ObjectStore</title>
  <desc id="desc">LunarSky woven hexagon logo and ObjectStore title on white with a soft prismatic gradient.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f9fbff"/>
    </linearGradient>
    <linearGradient id="logo-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#63ddcb"/>
      <stop offset=".5" stop-color="#75a7ed"/>
      <stop offset="1" stop-color="#aa78ea"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#eff9fd"/>
      <stop offset=".24" stop-color="#caefe8"/>
      <stop offset=".55" stop-color="#b9c7fa"/>
      <stop offset=".78" stop-color="#d7b5f4"/>
      <stop offset="1" stop-color="#f5cadc"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#73dfd1" stop-opacity="0"/>
      <stop offset=".4" stop-color="#8cbbfa" stop-opacity=".55"/>
      <stop offset=".75" stop-color="#ae94ef" stop-opacity=".78"/>
      <stop offset="1" stop-color="#e6a8d3" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#d5e0ff" stop-opacity=".72"/>
      <stop offset=".65" stop-color="#e8d7f9" stop-opacity=".36"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="31"/>
    </filter>
    <mask id="weave">
      <g fill="#fff">
        <path id="blade" d="M64 13 96 31 87 46 64 33 64 49 48 40 48 22Z"/>
        <use href="#blade" transform="rotate(60 64 64)"/>
        <use href="#blade" transform="rotate(120 64 64)"/>
        <use href="#blade" transform="rotate(180 64 64)"/>
        <use href="#blade" transform="rotate(240 64 64)"/>
        <use href="#blade" transform="rotate(300 64 64)"/>
      </g>
    </mask>
  </defs>

  <rect width="1600" height="300" fill="url(#paper)"/>
  <ellipse cx="1335" cy="114" rx="365" ry="226" fill="url(#glow)"/>
  <path d="M986 300C1129 232 1213 134 1308 86c85-43 174-45 292-61v275Z" fill="url(#ribbon)" opacity=".77"/>
  <path d="M1023 311c150-89 243-225 381-253 69-14 132-12 217-34" fill="none" stroke="url(#edge)" stroke-width="74" opacity=".45" filter="url(#soften)"/>
  <path d="M1024 300c155-91 253-204 398-235 68-14 119-12 178-17" fill="none" stroke="url(#edge)" stroke-width="2" opacity=".7"/>
  <path d="M1134 300c121-60 222-154 340-172 44-7 85-7 126-7" fill="none" stroke="#ffffff" stroke-width="1.5" opacity=".64"/>
  <path d="M1250 300c97-39 181-99 276-105 24-2 49-2 74-1" fill="none" stroke="#ffffff" stroke-width="1.5" opacity=".5"/>

  <g transform="translate(62 86)">
    <rect width="128" height="128" fill="url(#logo-gradient)" mask="url(#weave)"/>
  </g>
  <text x="224" y="171" fill="#202b45" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="650" letter-spacing="-2">LunarSky</text>
  <path d="M522 99v103" stroke="#cbd5e6" stroke-width="2"/>
  <text x="562" y="178" fill="#17233d" font-family="Inter Display, Inter, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-4">ObjectStore</text>
</svg>
